ai.service.enabled=false
ai.service.url=http://ai-test.invalid

# 테스트는 Docker나 개인 .env에 의존하지 않는 메모리 DB를 사용합니다.
spring.datasource.url=jdbc:h2:mem:emour-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.docker.compose.enabled=false

# 채팅 발행·구독과 토큰 저장은 테스트에서도 실제 Docker Redis를 사용합니다.
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
chat.redis.enabled=true
