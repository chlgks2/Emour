# ===== 공통 설정 (모든 환경 공유) =====
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      
  application:
    name: Emour
  profiles:
    active: local   # 로컬 실행 시 application-local.yml 을 함께 적용
  servlet:
    multipart:
      max-file-size: 10MB      # 파일 1개 최대 크기
      max-request-size: 10MB   # 요청 전체 최대 크기

# ===== 파일 저장 (팀 배포 규약) =====
# app.upload.dir : 파일이 저장될 실제 디렉토리
#   - 로컬  : 기본값 ./uploads
#   - EC2   : 환경변수 APP_UPLOAD_DIR=/app/uploads 로 주입됨 (하드코딩 금지)
# app.upload.base-url : 응답에 내려줄 이미지 URL 접두어
#   - 서버에선 APP_UPLOAD_BASE_URL 환경변수로 실제 도메인 지정
app:
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}
    base-url: ${APP_UPLOAD_BASE_URL:http://localhost:8080}

# ===== JWT 설정 =====
# secret 은 실제로는 환경변수(JWT_SECRET)로 주입. 없으면 아래 기본값 사용(로컬 전용).
jwt:
  secret: ${JWT_SECRET:ThisIsALocalDevSecretKeyChangeMeToALongRandom256BitValue!!}
  access-token-validity-ms: 1800000       # Access Token 유효기간: 30분
  refresh-token-validity-ms: 1209600000   # Refresh Token 유효기간: 14일

# ===== 커플 초대 설정 =====
couple:
  invitation-validity-hours: ${COUPLE_INVITATION_VALIDITY_HOURS:24}

# 배포 서버에 health 주소만 공개하고 DB 등의 상세정보는 숨깁니다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
