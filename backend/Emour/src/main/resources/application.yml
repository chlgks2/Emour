# ===== 공통 설정 (모든 환경 공유) =====
spring:
  config:
    # IntelliJ 로컬 실행에서는 프로젝트 루트의 .env를 선택적으로 읽습니다.
    # 배포 환경에는 파일이 없어도 실제 환경변수를 그대로 사용합니다.
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

  application:
    name: Emour
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 10MB      # 파일 1개 최대 크기
      max-request-size: 10MB   # 요청 전체 최대 크기

  # ===== 이메일(SMTP) 발송 설정 =====
  # 실제 값(계정/앱 비밀번호)은 .env 의 환경변수로 주입합니다. 기본은 Gmail SMTP.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ===== 파일 저장 (팀 배포 규약) =====
# app.upload.dir : 파일이 저장될 실제 디렉토리
#   - 로컬  : 기본값 ./uploads
#   - EC2   : 환경변수 APP_UPLOAD_DIR=/app/uploads 로 주입됨 (하드코딩 금지)
# Nginx가 TLS를 종료하는 배포 구조에서 X-Forwarded-Proto=https를 올바르게 인식합니다.
server:
  forward-headers-strategy: framework

app:
  websocket:
    # WebSocket/SockJS 연결을 허용할 프런트 주소입니다. 운영에서는 실제 도메인만 남깁니다.
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*,https://i15b208.p.ssafy.io,http://i15b208.p.ssafy.io:8080}
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}
  # 이메일 발송 방식: console(기본, 콘솔 출력) | smtp(실제 발송)
  email:
    mode: ${EMAIL_MODE:console}
    from: ${MAIL_USERNAME:}
  # 구글 소셜 로그인: 프론트가 보낸 ID 토큰의 aud 검증에 사용 (secret 불필요)
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}

# ===== JWT 설정 =====
# secret 은 실제로는 환경변수(JWT_SECRET)로 주입. 없으면 아래 기본값 사용(로컬 전용).
jwt:
  secret: ${JWT_SECRET:ThisIsALocalDevSecretKeyChangeMeToALongRandom256BitValue!!}
  access-token-validity-ms: 1800000       # Access Token 유효기간: 30분
  refresh-token-validity-ms: 1209600000   # Refresh Token 유효기간: 14일

# ===== 커플 초대 설정 =====
couple:
  invitation-validity-hours: ${COUPLE_INVITATION_VALIDITY_HOURS:24}

# ===== AI 감정 분석 설정 =====
ai:
  service:
    # 배포 환경에서 설정한 AI 서버 주소를 사용합니다.
    url: ${AI_SERVICE_URL}
    enabled: ${AI_ANALYSIS_ENABLED:true}
    poll-delay-ms: ${AI_ANALYSIS_POLL_DELAY_MS:1000}

# ===== 채팅 실시간 전달 설정 =====
chat:
  redis:
    # 모든 백엔드 서버가 같은 채널을 사용해야 서로의 채팅을 받을 수 있습니다.
    channel: ${CHAT_REDIS_CHANNEL:emour:chat:events}
  encryption:
    # Base64로 인코딩한 32바이트 AES 키. 운영 키는 Git이 아닌 배포 Secret으로 주입합니다.
    key: ${CHAT_ENCRYPTION_KEY}
    migrate-plaintext: ${CHAT_ENCRYPTION_MIGRATE_PLAINTEXT:true}
# 원본 데이터가 바뀐 방의 대시보드 변경을 묶어서 반영하는 간격입니다.
dashboard:
  change-refresh-delay-ms: ${DASHBOARD_CHANGE_REFRESH_DELAY_MS:1000}

# 배포 서버에 health 주소만 공개하고 DB 등의 상세정보는 숨깁니다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # 메일(SMTP) 서버 접속 가능 여부는 앱 생존과 무관하므로 health 에서 제외.
    # (안 끄면 /actuator/health 마다 smtp 접속을 시도해, 메일 계정 없는 환경에서 health 가 DOWN 이 됨)
    mail:
      enabled: false
