# 실제 MySQL을 사용할 때 mysql 프로필을 선택합니다.
# 예: --spring.profiles.active=mysql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/emour?serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 운영 전에는 Flyway 같은 마이그레이션 도구로 바꾸는 것을 권장합니다.
spring.jpa.hibernate.ddl-auto=validate
