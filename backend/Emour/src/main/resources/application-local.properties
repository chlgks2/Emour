# Docker 없이 바로 실행할 수 있는 연습용 메모리 DB입니다.
spring.datasource.url=jdbc:h2:mem:emour;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 서버를 켤 때 테이블을 만들고, 끄면 연습 데이터를 지웁니다.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true

# 브라우저에서 http://localhost:8080/h2-console 로 DB를 볼 수 있습니다.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
