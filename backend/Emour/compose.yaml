services:
  ai:
    build:
      # compose.yaml 위치를 기준으로 저장소의 AI 프로젝트를 빌드합니다.
      context: ../../AI
      dockerfile: Dockerfile
    environment:
      # 로컬에서는 API 키 없이 확인할 수 있도록 Mock 분석기를 사용합니다.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      MOCK_STRATEGY: ${MOCK_STRATEGY:-hash}
      MAX_TARGET: ${AI_MAX_TARGET:-10}
      MAX_CONTEXT: ${AI_MAX_CONTEXT:-10}
    ports:
      # 호스트의 8083 포트를 AI 컨테이너 내부 8000 포트에 연결합니다.
      - '8083:8000'
    restart: unless-stopped

  mysql:
    image: 'mysql:latest'
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
    volumes:
      # MySQL 데이터가 처음 만들어질 때 프로젝트 스키마를 자동 적용합니다.
      - './Emour_SQL_schema.sql:/docker-entrypoint-initdb.d/01-emour-schema.sql:ro'
    ports:
      - '3306'
  redis:
    image: 'redis:latest'
    ports:
      - '6379'
